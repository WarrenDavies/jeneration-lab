experiment:
  experiment_name: "Test - LLM"
  experiment_description: "A test experiment with LLM model"
  generation_format: "text"
  reset_model_each_run: True
  warmup_runs: 1

generator:
    model: "llama-cpp"
    model_path: ".models/Llama-3.2-3B-Instruct-Q4_K_M.gguf"
    device: "cpu"
    dtype: "float32"
    number_of_threads: 8
    n_gpu_layers: -1
    verbose_warnings: False
    max_context_size: 4096
    max_tokens_per_response: 512
    temperature: 1
    top_p: 1
    top_k: 10
    messages:
      - role: system
        content: |
          You are Jenbot, an expert, helpful, and diligent assistant. You provide the user with accurate answers to their queries. You are polite, friendly, and a little sarcastic.
      - role: user
        content: |
          Hi who are you?

variables:
  top_k:
    dtype: "int"
    min: 1
    max: 2
    step: 1
  messages:
    dtype: "list"
    items:
      - - role: user
          content: |
            Please write a poem exactly 30 words long. The quality or content of the poem doesn't matter, but it must have exactly 30 words.

metrics:
  word_count:
    params: {}

ratings:
  subjective_liking: 
    type: "int"
    question: "How much do you like this response on a scale of 1-10?"