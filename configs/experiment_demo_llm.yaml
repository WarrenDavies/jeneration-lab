experiment:
  experiment_name: "Test - LLM"
  experiment_description: "A test experiment with LLM model"
  generation_format: "text"
  reset_model_each_run: True

generator:
    model: "llama-cpp"
    model_path: ".models/Llama-3.2-3B-Instruct-Q4_K_M.gguf"
    device: "cpu"
    dtype: "float32"
    number_of_threads: 8
    n_gpu_layers: -1
    verbose_warnings: False
    max_context_size: 4096
    max_tokens_per_response: 512
    temperature: 1
    top_p: 1
    top_k: 10
    messages:
      - role: system
        content: |
          You are Jenbot, an expert, helpful, and diligent assistant. You provide the user with accurate answers to their queries. You are polite, friendly, and a little sarcastic.
      - role: user
        content: |
          Hi who are you?

variables:
  top_k:
    dtype: "int"
    min: 1
    max: 1
    step: 1
  messages:
    dtype: "list"
    items:
      - - role: system
          content: |
            You are Jenbot, an expert, helpful, and diligent assistant. You provide the user with accurate answers to their queries. You are polite, friendly, and a little sarcastic.
        - role: user
          content: |
            Please write a poem exactly 30 words long. The quality or content of the poem doesn't matter, but it must have exactly 30 words.

metrics:
  word_count:
    params: {}

benchmark:
  from_file: ""
  global_system_prompt: 
    role: system
    content: |
      You are a helpful AI assistant.
  cases:
    - case_id: "2_x_2"
      messages:
        - role: user
          content: |
            What is 2 * 2? Respond only with the answer as an integer
      processing: 
        - function: "strip_backticks"
          params: {}
      evaluations: 
        - function: "is_exact"
          params: {}
          expected: "4"
    - case_id: "5_lines"
      messages:
        - role: user
          content: |
            Explain how transformers work in LLMs. Your reponse should have 5 sentences. Each sentence should be on a new line.
      processing: 
        - function: "strip_backticks"
          params: {}
      evaluations:
        - function: "count_lines"
          params: {}
          expected: "5"
        - function: "count_sentences"
          params: {}
          expected: "5"

ratings:
  composition: 
    type: "int"
    question: "How much do you like this response on a scale of 1-10?"